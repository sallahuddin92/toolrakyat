[package]
name = "starpdf"
version = "0.1.0"
edition = "2021"
authors = ["ToolRakyat Core Engineering"]
description = "Low-level, zero-dependency, high-performance PDF engine."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
miniz_oxide = "0.9.1"
sha2 = "0.10.9"
wasm-bindgen = { version = "=0.2.127", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
unicode-bidi = "0.3.18"
harfrust = "0.13.1"
read-fonts = "0.43.2"
skrifa = "0.46.2"
skera = "0.6.0"
write-fonts = "0.52.0"
tiny-skia = "0.11"
jpeg-decoder = "0.3"
wgpu = { version = "30", optional = true }
bytemuck = { version = "1.25", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }
lyon_tessellation = { version = "1.0", optional = true }
lyon_path = { version = "1.0", optional = true }

[features]
default = []
wasm = ["wasm-bindgen", "serde", "serde-wasm-bindgen"]
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster", "dep:lyon_tessellation", "dep:lyon_path"]

[dev-dependencies]
serde_json = "1.0"

[[bench]]
name = "benchmark_main"
harness = false

[[bench]]
name = "execution_shadow"
harness = false
