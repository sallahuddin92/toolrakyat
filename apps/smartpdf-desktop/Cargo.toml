[package]
name = "smartpdf-desktop"
version = "0.1.0"
edition = "2021"
authors = ["ToolRakyat Desktop Engineering"]
description = "Native macOS desktop application for SmartPDF"

[dependencies]
slint = "1.18.1"
rfd = "0.15"
starpdf = { path = "../../engine/starpdf", features = ["gpu"] }
starpdf-app-core = { path = "../../crates/starpdf-app-core", features = ["gpu"] }

[dev-dependencies]
i-slint-backend-testing = "1.18.1"
image = "0.25"

[build-dependencies]
slint-build = "1.18.1"
