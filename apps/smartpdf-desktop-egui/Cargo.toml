[package]
name = "smartpdf-desktop-egui"
version = "0.1.0"
edition = "2021"
authors = ["ToolRakyat Desktop Engineering"]
description = "Acrobat Pro-class egui desktop frontend for SmartPDF powered by StarPDF engine."
license = "MIT OR Apache-2.0"

[lib]
name = "smartpdf_desktop_egui"
path = "src/lib.rs"

[[bin]]
name = "smartpdf-desktop-egui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "links"] }
egui = { version = "0.36", features = ["bytemuck"] }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
starpdf = { path = "../../engine/starpdf", features = ["gpu"] }
starpdf-app-core = { path = "../../crates/starpdf-app-core", features = ["gpu"] }
bytemuck = "1.25"
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", default-features = false, features = ["std", "NSEvent"] }
